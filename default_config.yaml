# 数据库配置
database:
  type: "sqlite"  # 支持 mysql 或 sqlite
  mysql:
    host: "localhost"
    port: 3306
    username: "oj"
    password: "CHANGE_ME_MYSQL_PASSWORD"
    dbname: "patreonoj"
    charset: "utf8mb4"
    parseTime: true
    loc: "Local"
  sqlite:
    path: "./data/patreon.db"

# OSS 配置
oss:
  address: "127.0.0.1:9000"
  public_address: "http://localhost:9000"  # 生产改为 https://你的站点域名
  public_path_prefix: ""
  public_read_prefixes: ["avatars/"] # 公开读前缀，会自动添加 / 前缀
  access_key: "ojadmin"
  secret_key: "CHANGE_ME_MINIO_PASSWORD"
  bucket_name: "patreon-oj-cases"

# 服务器配置
server:
  host: "127.0.0.1"
  port: 8080
  mode: "debug"  # debug, release, test
  secure_cookies: false # HTTPS 反代生产环境设 true，本地 HTTP 开发设 false
  trusted_proxies: [] # 同机 Caddy 可设 ["127.0.0.1", "::1"]
  auth_max_concurrent: 2 # Argon2 单次约 64 MiB，同时最多 2 次
  auth_requests_per_minute: 20 # 每个客户端 IP，登录/注册共用

# 评测服务配置
judge:
  mode: "local"  # local: 本地评测, remote: 远程API评测
  timeout: 15  # 超时时间（秒）
  queue_size: 100  # 队列大小

  # Go-Judge 配置 (远程高效沙箱)
  go_judge:
    enabled: false
    api_url: "http://localhost:5050/run"
    token: "" 
  
  # 本地评测配置
  local:
    enabled: true
    executor: docker
    max_memory: 256
    # ms为单位
    max_time: 5000
    max_output_size: 1024
    max_work_size: 256 # MiB；/work 使用 tmpfs，不挂载宿主目录
    docker_image_go: golang:1.22-bookworm
    docker_image_cpp: gcc:13-bookworm
    docker_image_python: python:3.12-bookworm
    docker_image_java: eclipse-temurin:21-jdk

# 图数据库配置
graph_database:
  enabled: false # 题目推荐和关系图使用关系型数据库，不依赖 Neo4j
  neo4j:
    uri: "bolt://localhost:7687"
    username: "neo4j"
    password: "password"
    database: "neo4j"  # 使用默认数据库，避免版本兼容问题

# 日志配置
log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  output: "stdout"  # stdout, file
  file_path: "./logs/app.log"

# AI 服务配置 (支持 OpenAI / Ollama / 其他兼容服务)
ai:
  enabled: false  # 是否启用 AI 功能
  # Ollama 本地部署示例:
  # base_url: "http://localhost:11434/v1"
  # api_key: ""  # Ollama 不需要 API Key
  # model: "qwen2.5:7b"
  
  # OpenAI 示例:
  base_url: "https://api.openai.com/v1"
  api_key: ""  # 填入你的 API Key
  model: "gpt-3.5-turbo"
  temperature: 0.7  # 生成温度，0-1，越高越随机
